services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-dev
    working_dir: /src
    volumes:
      - .:/src
      - /src/bin
      - /src/obj
    ports:
      - "3001:3001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:3001
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    stdin_open: true
    tty: true
